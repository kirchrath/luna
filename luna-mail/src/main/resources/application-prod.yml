spring:
  config:
    import:
      - optional:configtree:/run/secrets/
      # All accounts with their app passwords, from the secret mail_accounts_v<n>.
      - optional:file:/run/secrets/mail-accounts.yml
  datasource:
    url: jdbc:postgresql://postgres:5432/luna?currentSchema=luna_mail
    username: luna
  kafka:
    bootstrap-servers: kafka:9094
    ssl:
      trust-store-location: file:/step/certs/root_ca.crt
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://luna.internal/auth/realms/luna
          jwk-set-uri: http://keycloak:8080/auth/realms/luna/protocol/openid-connect/certs
