openapi: 3.1.0
info:
  title: Luna Alert API
  version: 0.0.1-SNAPSHOT
servers:
- url: /api/luna-alert
paths:
  /alerts/{id}/resolve:
    post:
      tags:
      - Alerts
      operationId: resolveAlert
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertDto"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
  /alerts/{id}/reopen:
    post:
      tags:
      - Alerts
      operationId: reopenAlert
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertDto"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
  /alerts/{id}/acknowledge:
    post:
      tags:
      - Alerts
      operationId: acknowledgeAlert
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertDto"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "409":
          description: Conflict
  /alerts:
    get:
      tags:
      - Alerts
      operationId: listAlerts
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
      - name: status
        in: query
        required: false
        schema:
          type: array
          default: []
          items:
            type: string
            enum:
            - OPEN
            - ACKNOWLEDGED
            - RESOLVED
      - name: area
        in: query
        required: false
        schema:
          type: string
          enum:
          - PERSONAL
          - WORK
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListDto"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
  /alerts/{id}:
    get:
      tags:
      - Alerts
      operationId: getAlert
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertDto"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
components:
  schemas:
    AlertDataDto:
      type: object
      properties:
        title:
          type: string
        message:
          type: string
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        affectedSystem:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
        acknowledgedDate:
          type: string
          format: date-time
        resolvedDate:
          type: string
          format: date-time
        source:
          type: string
          enum:
          - CORE
        sourceId:
          type: string
          format: uuid
        area:
          type: string
          enum:
          - PERSONAL
          - WORK
      required:
      - area
      - message
      - severity
      - source
      - status
      - title
    AlertDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AlertDataDto"
        audit:
          $ref: "#/components/schemas/AuditDto"
      required:
      - audit
      - data
    AuditDto:
      type: object
      properties:
        createdDate:
          type: string
          format: date-time
        lastModifiedDate:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
      required:
      - createdDate
      - lastModifiedDate
      - version
    AlertListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertListItemDto"
        totalPages:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int64
      required:
      - items
      - totalCount
      - totalPages
    AlertListItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        area:
          type: string
          enum:
          - PERSONAL
          - WORK
        title:
          type: string
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        affectedSystem:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
        createdDate:
          type: string
          format: date-time
      required:
      - area
      - createdDate
      - id
      - severity
      - status
      - title
    AlertChangedDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
