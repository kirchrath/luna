openapi: 3.1.0
info:
  title: Luna Core API
  version: 0.0.1-SNAPSHOT
servers:
- url: /api/luna-core
paths:
  /inbound-events/manual:
    get:
      tags:
      - Inbound events
      operationId: listManualInboundEvents
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualInboundEventListDto"
        "401":
          description: Unauthorized
    post:
      tags:
      - Inbound events
      operationId: createManualInboundEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualInputDataDto"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceReferenceDto"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
components:
  schemas:
    ManualInputDataDto:
      type: object
      properties:
        text:
          type: string
          maxLength: 10000
          minLength: 0
        typeHint:
          type: string
          enum:
          - TASK
          - ALERT
          - APPOINTMENT
          - INVOICE
          - CONTRACT
          - NOTE
      required:
      - text
    ResourceReferenceDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    ElementReferenceDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - TASK
          - ALERT
          - APPOINTMENT
          - INVOICE
          - CONTRACT
          - NOTE
      required:
      - id
      - type
    ManualInboundEventListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ManualInboundEventListItemDto"
        totalPages:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int64
      required:
      - items
      - totalCount
      - totalPages
    ManualInboundEventListItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        typeHint:
          type: string
          enum:
          - TASK
          - ALERT
          - APPOINTMENT
          - INVOICE
          - CONTRACT
          - NOTE
        status:
          type: string
          enum:
          - RECEIVED
          - ANALYZED
          - FAILED
        createdDate:
          type: string
          format: date-time
        elements:
          type: array
          items:
            $ref: "#/components/schemas/ElementReferenceDto"
      required:
      - createdDate
      - elements
      - id
      - status
      - text
    InboundEventChangedDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
