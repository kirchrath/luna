openapi: 3.1.0
info:
  title: Luna Core API
  version: 0.0.1-SNAPSHOT
servers:
- url: /api/luna-core
tags:
- name: Inbound events
  description: Events that luna-core receives and analyses
paths:
  /inbound-events/manual:
    get:
      tags:
      - Inbound events
      summary: "List manual inputs with their processing status, newest first"
      operationId: listManualInboundEvents
      parameters:
      - name: page
        in: query
        description: "Page number, starting at 0"
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: "Page size; default and maximum are configured in luna-core,\
          \ larger values are limited to the maximum"
        schema:
          type: integer
          minimum: 1
      responses:
        "200":
          description: Page of manual inputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualInboundEventListDto"
        "401":
          description: Missing or invalid access token
    post:
      tags:
      - Inbound events
      summary: Submit a manual input as inbound event
      operationId: createManualInboundEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualInputDataDto"
        required: true
      responses:
        "202":
          description: Input accepted and stored for analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceReferenceDto"
        "400":
          description: Invalid input
        "401":
          description: Missing or invalid access token
components:
  schemas:
    ManualInputDataDto:
      type: object
      description: Manual input of the user that luna-core analyses
      properties:
        text:
          type: string
          description: Free text of the input
          maxLength: 10000
          minLength: 0
        typeHint:
          type: string
          description: Optional hint which element should result from the input; overrides
            the analysis
          enum:
          - TASK
          - ALERT
          - APPOINTMENT
          - INVOICE
          - CONTRACT
          - NOTE
      required:
      - text
    ResourceReferenceDto:
      type: object
      description: Reference to a created resource
      properties:
        id:
          type: string
          format: uuid
          description: ID of the created resource
      required:
      - id
    ElementReferenceDto:
      type: object
      description: Reference to an element that luna-core created from an inbound
        event
      properties:
        id:
          type: string
          format: uuid
          description: ID of the element; equals the id of the event published on
            Kafka
        type:
          type: string
          description: Type of the element
          enum:
          - TASK
          - ALERT
          - APPOINTMENT
          - INVOICE
          - CONTRACT
          - NOTE
      required:
      - id
      - type
    ManualInboundEventListDto:
      type: object
      description: "Page of manual inputs, newest first"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ManualInboundEventListItemDto"
        totalPages:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int64
      required:
      - items
      - totalCount
      - totalPages
    ManualInboundEventListItemDto:
      type: object
      description: Manual input in a list together with its processing status
      properties:
        id:
          type: string
          format: uuid
          description: ID of the inbound event
        text:
          type: string
          description: Free text of the input
        typeHint:
          type: string
          description: "Hint which element should result from the input, if given"
          enum:
          - TASK
          - ALERT
          - APPOINTMENT
          - INVOICE
          - CONTRACT
          - NOTE
        status:
          type: string
          description: Processing status of the input
          enum:
          - RECEIVED
          - ANALYZED
          - FAILED
        createdDate:
          type: string
          format: date-time
          description: Point in time the input was received
        elements:
          type: array
          description: Elements created from the input
          items:
            $ref: "#/components/schemas/ElementReferenceDto"
      required:
      - createdDate
      - elements
      - id
      - status
      - text
    InboundEventChangedDto:
      type: object
      description: Push message via STOMP over WebSocket (endpoint /ws) on topic /topic/inbound-events/manual
        when an inbound event becomes ANALYZED or FAILED.
      properties:
        id:
          type: string
          format: uuid
          description: ID of the changed inbound event
      required:
      - id
