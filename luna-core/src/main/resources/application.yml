spring:
  application:
    name: luna-core
    version: @project.version@
  profiles:
    default: local
  datasource:
    url:
    username:
    password:
  flyway:
    schemas: luna_core
    default-schema: luna_core
  ai:
    model:
      chat:
      decision: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  kafka:
    bootstrap-servers:
    security:
      protocol: SASL_SSL
    ssl:
      trust-store-type: PEM
      trust-store-location:
    properties:
      "[sasl.mechanism]": SCRAM-SHA-512
      "[sasl.jaas.config]": org.apache.kafka.common.security.scram.ScramLoginModule required username="${spring.application.name}" password="${app.kafka.password}";
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.key.delegate.class]": org.apache.kafka.common.serialization.UUIDDeserializer
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.value.default.type]": de.kirchrath.luna.core.dto.mail.EmailEventDto
        "[spring.json.use.type.headers]": false
    listener:
      # A missing topic or ACL (e.g. while kafka-init is still running) must not stop the consumer for good.
      auth-exception-retry-interval: 10s
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
  jackson:
    # Optional fields are left out instead of sent as null, as the OpenAPI specification describes them.
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
          jwk-set-uri:

server:
  port: 7081
  # Traefik terminates TLS and calls the service via http; its X-Forwarded-* headers give the original https URL,
  # without them every POST/PUT and the WebSocket handshake from https://luna.internal counts as foreign origin (403).
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins:
  websocket:
    endpoint: /ws
    broker-prefix: /topic
    topics:
      inbound-events: ${app.websocket.broker-prefix}/inbound-events
  kafka:
    password:
    topics:
      task: luna_core_task
      alert: luna_core_alert
      appointment: luna_core_appointment
      invoice: luna_core_invoice
      contract: luna_core_contract
      note: luna_core_note
      mail-email: luna_mail_email
      mail-email-retry: luna_core_email_retry
      dlt: luna_core_dlt
    retry:
      retries: 10
      delay: 10s
  prompts:
    classification: classpath:prompts/classification.st
    task: classpath:prompts/qualification/task.st
    alert: classpath:prompts/qualification/alert.st
    appointment: classpath:prompts/qualification/appointment.st
    invoice: classpath:prompts/qualification/invoice.st
    contract: classpath:prompts/qualification/contract.st
    note: classpath:prompts/qualification/note.st
  classification:
    interval: 30s
    batch-size: 10
    max-attempts: 3
