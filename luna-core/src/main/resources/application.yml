spring:
  application:
    name: luna-core
    version: @project.version@
  profiles:
    default: local
  datasource:
    url:
    username:
    password:
  flyway:
    schemas: luna_core
    default-schema: luna_core
  ai:
    model:
      chat:
      decision: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:

server:
  port: 7081

app:
  cors:
    allowed-origins:
  classification:
    interval: 30s
    batch-size: 10
    max-attempts: 3
