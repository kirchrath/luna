spring:
  application:
    name: luna-core
    version: @project.version@
  profiles:
    default: local
  datasource:
    url:
    username:
    password:
  flyway:
    schemas: luna_core
    default-schema: luna_core
  ai:
    model:
      chat:
      decision: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  kafka:
    bootstrap-servers:
    security:
      protocol: SASL_SSL
    ssl:
      trust-store-type: PEM
      trust-store-location:
    properties:
      "[sasl.mechanism]": SCRAM-SHA-512
      "[sasl.jaas.config]": org.apache.kafka.common.security.scram.ScramLoginModule required username="luna-core" password="${app.kafka.password}";
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
          jwk-set-uri:

server:
  port: 7081

app:
  cors:
    allowed-origins:
  kafka:
    password:
  classification:
    interval: 30s
    batch-size: 10
    max-attempts: 3
