spring:
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: jdbc:postgresql://postgres:5432/luna?currentSchema=luna_core
    username: luna
  kafka:
    bootstrap-servers: kafka:9094
    ssl:
      trust-store-location: file:/step/certs/root_ca.crt
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://luna.internal/auth/realms/luna
          jwk-set-uri: http://keycloak:8080/auth/realms/luna/protocol/openid-connect/certs

app:
  cors:
    # Traefik forwards the WebSocket handshake with X-Forwarded-Proto wss, so the own origin never matches the computed
    # URL; it is therefore allowed explicitly.
    allowed-origins: https://luna.internal
  ai:
    # One provider per life area. Type, base URL and model come from the environment (APP_AI_PROVIDERS_<AREA>_TYPE,
    # _BASE_URL, _MODEL), the API key from the secret luna_core_ai_<area>_api_key.
    areas:
      PERSONAL: personal
      WORK: work
