# Same routing as in the stack (swarm/), without TLS: the backends (/api/<backend>) and /auth go to their services,
# everything else to the frontend.
http:
  routers:
    luna-core:
      rule: PathPrefix(`/api/luna-core`)
      entryPoints: [web]
      middlewares: [luna-core-strip-prefix]
      service: luna-core
    luna-task:
      rule: PathPrefix(`/api/luna-task`)
      entryPoints: [web]
      middlewares: [luna-task-strip-prefix]
      service: luna-task
    luna-note:
      rule: PathPrefix(`/api/luna-note`)
      entryPoints: [web]
      middlewares: [luna-note-strip-prefix]
      service: luna-note
    luna-appointment:
      rule: PathPrefix(`/api/luna-appointment`)
      entryPoints: [web]
      middlewares: [luna-appointment-strip-prefix]
      service: luna-appointment
    luna-mail:
      rule: PathPrefix(`/api/luna-mail`)
      entryPoints: [web]
      middlewares: [luna-mail-strip-prefix]
      service: luna-mail
    luna-alert:
      rule: PathPrefix(`/api/luna-alert`)
      entryPoints: [web]
      middlewares: [luna-alert-strip-prefix]
      service: luna-alert
    keycloak:
      rule: PathPrefix(`/auth`)
      entryPoints: [web]
      service: keycloak
    frontend:
      rule: PathPrefix(`/`)
      entryPoints: [web]
      service: frontend
  middlewares:
    luna-core-strip-prefix:
      stripPrefix:
        prefixes: [/api/luna-core]
    luna-task-strip-prefix:
      stripPrefix:
        prefixes: [/api/luna-task]
    luna-note-strip-prefix:
      stripPrefix:
        prefixes: [/api/luna-note]
    luna-appointment-strip-prefix:
      stripPrefix:
        prefixes: [/api/luna-appointment]
    luna-mail-strip-prefix:
      stripPrefix:
        prefixes: [/api/luna-mail]
    luna-alert-strip-prefix:
      stripPrefix:
        prefixes: [/api/luna-alert]
  services:
    luna-core:
      loadBalancer:
        servers: [{ url: http://luna-core:7081 }]
    luna-task:
      loadBalancer:
        servers: [{ url: http://luna-task:7082 }]
    luna-note:
      loadBalancer:
        servers: [{ url: http://luna-note:7084 }]
    luna-appointment:
      loadBalancer:
        servers: [{ url: http://luna-appointment:7085 }]
    luna-mail:
      loadBalancer:
        servers: [{ url: http://luna-mail:7086 }]
    luna-alert:
      loadBalancer:
        servers: [{ url: http://luna-alert:7083 }]
    keycloak:
      loadBalancer:
        servers: [{ url: http://keycloak:8080 }]
    frontend:
      loadBalancer:
        servers: [{ url: http://frontend:8080 }]
