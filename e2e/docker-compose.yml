# Test environment for the end-to-end tests (not for production). Started and stopped by Playwright
# (environment/), reachable at http://localhost:7180. All values here are test values, not secrets.
name: luna-e2e

services:
  traefik:
    image: traefik:v3.7.19
    command:
      - --entrypoints.web.address=:7180
      - --providers.file.filename=/etc/traefik/dynamic.yml
    ports:
      - '7180:7180'
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: luna
      POSTGRES_USER: luna
      POSTGRES_PASSWORD: luna-e2e

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-e2e
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:7180/auth
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ../swarm/keycloak/luna-realm.json:/opt/keycloak/data/import/luna-realm.json:ro

  ai-stub:
    image: python:3.13.18-alpine
    command: python -I /stub/stub.py
    volumes:
      - ./ai-stub/stub.py:/stub/stub.py:ro

  luna-core:
    image: luna-core:e2e
    depends_on:
      - postgres
      - kafka
      - keycloak
      - ai-stub
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/luna?currentSchema=luna_core
      SPRING_DATASOURCE_USERNAME: luna
      SPRING_DATASOURCE_PASSWORD: luna-e2e
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      SPRING_KAFKA_SSL_TRUST_STORE_TYPE: ''
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:7180/auth/realms/luna
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/luna/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ''
      APP_CLASSIFICATION_INTERVAL: 1s
      SPRING_AI_MODEL_CHAT: openai
      SPRING_AI_OPENAI_BASE_URL: http://ai-stub:8000
      SPRING_AI_OPENAI_API_KEY: e2e
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: stub

  luna-task:
    image: luna-task:e2e
    depends_on:
      - postgres
      - kafka
      - keycloak
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/luna?currentSchema=luna_task
      SPRING_DATASOURCE_USERNAME: luna
      SPRING_DATASOURCE_PASSWORD: luna-e2e
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      SPRING_KAFKA_SSL_TRUST_STORE_TYPE: ''
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:7180/auth/realms/luna
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/luna/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ''

  luna-alert:
    image: luna-alert:e2e
    depends_on:
      - postgres
      - kafka
      - keycloak
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/luna?currentSchema=luna_alert
      SPRING_DATASOURCE_USERNAME: luna
      SPRING_DATASOURCE_PASSWORD: luna-e2e
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      SPRING_KAFKA_SSL_TRUST_STORE_TYPE: ''
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:7180/auth/realms/luna
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/luna/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ''

  luna-note:
    image: luna-note:e2e
    depends_on:
      - postgres
      - kafka
      - keycloak
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/luna?currentSchema=luna_note
      SPRING_DATASOURCE_USERNAME: luna
      SPRING_DATASOURCE_PASSWORD: luna-e2e
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      SPRING_KAFKA_SSL_TRUST_STORE_TYPE: ''
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:7180/auth/realms/luna
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/luna/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ''

  frontend:
    image: luna-frontend:e2e
