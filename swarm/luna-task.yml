# luna-task backend.
#
# Build the image first (in luna-task/): ./mvnw package jib:dockerBuild
# Deploy together with the other stack files:
#   docker stack deploy -c swarm/infrastructure.yml -c swarm/kafka.yml -c swarm/luna-core.yml \
#     -c swarm/luna-task.yml -c swarm/luna-alert.yml -c swarm/luna-note.yml -c swarm/luna-appointment.yml \
#     -c swarm/frontend.yml luna
#
# Required variables: LUNA_TASK_VERSION (see README.md).
# Messages of ${VAR:?message} must not contain '-': Docker reads it as default value operator.

services:
  luna-task:
    image: luna-task:${LUNA_TASK_VERSION:?set LUNA_TASK_VERSION to the version of the luna task image}
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      # Root certificate of step-ca to verify the Kafka certificate.
      - step-ca-data:/step:ro
      - /etc/localtime:/etc/localtime:ro
    secrets:
      # Read by Spring via configtree: the file name is the property name.
      - source: luna_db_password
        target: spring.datasource.password
      - source: kafka_luna_task_password
        target: app.kafka.password
    networks:
      - luna
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.luna-task.rule: Host(`luna.internal`) && PathPrefix(`/api/luna-task`)
        traefik.http.routers.luna-task.entrypoints: websecure
        traefik.http.routers.luna-task.tls.certresolver: stepca
        traefik.http.routers.luna-task.middlewares: luna-task-strip-prefix
        traefik.http.middlewares.luna-task-strip-prefix.stripprefix.prefixes: /api/luna-task
        traefik.http.services.luna-task.loadbalancer.server.port: "7082"

networks:
  luna:
    name: luna
    driver: overlay
    attachable: true

volumes:
  step-ca-data:

secrets:
  luna_db_password:
    external: true
  kafka_luna_task_password:
    external: true
