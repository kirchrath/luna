# Infrastructure services of Luna (Traefik, step-ca, PostgreSQL, Keycloak).
#
# Deploy (together with the other stack files in the same stack "luna"):
#   LUNA_KAFKA_CERT_VERSION=<n> docker stack deploy -c swarm/infrastructure.yml -c swarm/kafka.yml luna
#
# Prerequisites (external Docker secrets, hosts entry etc.): see README.md.
# All services use the time zone of the host (/etc/localtime).

services:
  traefik:
    image: traefik:v3.7.19
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=luna
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certResolver=stepca
      - --certificatesresolvers.stepca.acme.caServer=https://step-ca:9000/acme/acme/directory
      - --certificatesresolvers.stepca.acme.storage=/data/acme.json
      - --certificatesresolvers.stepca.acme.httpChallenge.entryPoint=web
      # step-ca issues certificates for 24 hours by default.
      - --certificatesresolvers.stepca.acme.certificatesDuration=24
    environment:
      # Traefik (lego) has to trust the root certificate of step-ca to call its ACME endpoint.
      LEGO_CA_CERTIFICATES: /step/certs/root_ca.crt
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - traefik-data:/data
      - step-ca-data:/step:ro
    networks:
      luna:
        # Containers in the stack (step-ca for the ACME challenge, backends for Keycloak)
        # reach luna.internal directly at Traefik through this alias.
        aliases:
          - luna.internal
    deploy:
      placement:
        constraints:
          - node.role == manager

  step-ca:
    image: smallstep/step-ca:0.30.2
    environment:
      DOCKER_STEPCA_INIT_NAME: Luna CA
      DOCKER_STEPCA_INIT_DNS_NAMES: step-ca,localhost
      DOCKER_STEPCA_INIT_ACME: "true"
      DOCKER_STEPCA_INIT_PASSWORD_FILE: /run/secrets/step_ca_password
    volumes:
      - step-ca-data:/home/step
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      # The image's healthcheck calls https://step-ca:9000, but Swarm only adds the service to DNS
      # after a passed healthcheck - so check via localhost instead.
      test: ["CMD-SHELL", "step ca health --ca-url https://localhost:9000 --root /home/step/certs/root_ca.crt 2>/dev/null | grep -q '^ok'"]
    secrets:
      - step_ca_password
    networks:
      - luna

  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "7432:5432"
    volumes:
      # Since PostgreSQL 18 /var/lib/postgresql is mounted (no longer .../data).
      - postgres-data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/10-create-databases.sh
        mode: 0555
    secrets:
      - postgres_password
      - keycloak_db_password
      - luna_db_password
    networks:
      - luna

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # Keycloak does not support *_FILE variables, so passwords are read from the secrets on startup.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export KC_DB_PASSWORD="$$(< /run/secrets/keycloak_db_password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(< /run/secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      # Public URL of Keycloak (issuer of the tokens).
      # Must match where the frontend expects Keycloak: https://luna.internal/auth for the stack (also on a laptop);
      # LUNA_KEYCLOAK_URL=http://localhost:7080/auth only for the Vite dev server (npm run dev).
      KC_HOSTNAME: ${LUNA_KEYCLOAK_URL:-https://luna.internal/auth}
    ports:
      - "7080:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    configs:
      # Imported on startup only if the realm does not exist yet; later changes are not applied (see README).
      - source: keycloak_luna_realm
        target: /opt/keycloak/data/import/luna-realm.json
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
    networks:
      - luna
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.keycloak.rule: Host(`luna.internal`) && PathPrefix(`/auth`)
        traefik.http.routers.keycloak.entrypoints: websecure
        traefik.http.routers.keycloak.tls.certresolver: stepca
        traefik.http.services.keycloak.loadbalancer.server.port: "8080"

networks:
  luna:
    name: luna
    driver: overlay
    attachable: true

volumes:
  traefik-data:
  step-ca-data:
  postgres-data:

configs:
  postgres_init:
    file: ./postgres/create-databases.sh
  keycloak_luna_realm:
    file: ./keycloak/luna-realm.json

secrets:
  step_ca_password:
    external: true
  postgres_password:
    external: true
  keycloak_db_password:
    external: true
  luna_db_password:
    external: true
  keycloak_admin_password:
    external: true
