# luna-core backend.
#
# Build the image first (in luna-core/): ./mvnw package jib:dockerBuild
# Deploy together with the other stack files:
#   docker stack deploy -c swarm/infrastructure.yml -c swarm/kafka.yml -c swarm/luna-core.yml luna
#
# Required variables: LUNA_CORE_VERSION and the AI provider of each life area (LUNA_AI_<AREA>_TYPE, _MODEL; see
# README.md).
# Messages of ${VAR:?message} must not contain '-': Docker reads it as default value operator.

services:
  luna-core:
    image: luna-core:${LUNA_CORE_VERSION:?set LUNA_CORE_VERSION to the version of the luna core image}
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # The AI provider of each life area; every input is analyzed by the provider of its area only.
      - APP_AI_PROVIDERS_PERSONAL_TYPE=${LUNA_AI_PERSONAL_TYPE:?set LUNA_AI_PERSONAL_TYPE to ollama, anthropic or openai}
      - APP_AI_PROVIDERS_PERSONAL_MODEL=${LUNA_AI_PERSONAL_MODEL:?set LUNA_AI_PERSONAL_MODEL to the chat model}
      - APP_AI_PROVIDERS_PERSONAL_BASE_URL=${LUNA_AI_PERSONAL_BASE_URL:-}
      - APP_AI_PROVIDERS_WORK_TYPE=${LUNA_AI_WORK_TYPE:?set LUNA_AI_WORK_TYPE to ollama, anthropic or openai}
      - APP_AI_PROVIDERS_WORK_MODEL=${LUNA_AI_WORK_MODEL:?set LUNA_AI_WORK_MODEL to the chat model}
      - APP_AI_PROVIDERS_WORK_BASE_URL=${LUNA_AI_WORK_BASE_URL:-}
    volumes:
      # Root certificate of step-ca to verify the Kafka certificate.
      - step-ca-data:/step:ro
      - /etc/localtime:/etc/localtime:ro
    secrets:
      # Read by Spring via configtree: the file name is the property name.
      - source: luna_db_password
        target: spring.datasource.password
      - source: kafka_luna_core_password
        target: app.kafka.password
      - source: luna_core_ai_personal_api_key
        target: app.ai.providers.personal.api-key
      - source: luna_core_ai_work_api_key
        target: app.ai.providers.work.api-key
    networks:
      - luna
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.luna-core.rule: Host(`luna.internal`) && PathPrefix(`/api/luna-core`)
        traefik.http.routers.luna-core.entrypoints: websecure
        traefik.http.routers.luna-core.tls.certresolver: stepca
        traefik.http.routers.luna-core.middlewares: luna-core-strip-prefix
        traefik.http.middlewares.luna-core-strip-prefix.stripprefix.prefixes: /api/luna-core
        traefik.http.services.luna-core.loadbalancer.server.port: "7081"

networks:
  luna:
    name: luna
    driver: overlay
    attachable: true

volumes:
  step-ca-data:

secrets:
  luna_db_password:
    external: true
  kafka_luna_core_password:
    external: true
  luna_core_ai_personal_api_key:
    external: true
  luna_core_ai_work_api_key:
    external: true
