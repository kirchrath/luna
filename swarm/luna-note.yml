# luna-note backend.
#
# Build the image first (in luna-note/): ./mvnw package jib:dockerBuild
# Deploy together with the other stack files:
#   docker stack deploy -c swarm/infrastructure.yml -c swarm/kafka.yml -c swarm/luna-core.yml \
#     -c swarm/luna-task.yml -c swarm/luna-alert.yml -c swarm/luna-note.yml -c swarm/luna-appointment.yml \
#     -c swarm/frontend.yml luna
#
# Required variables: LUNA_NOTE_VERSION (see README.md).
# Messages of ${VAR:?message} must not contain '-': Docker reads it as default value operator.

services:
  luna-note:
    image: luna-note:${LUNA_NOTE_VERSION:?set LUNA_NOTE_VERSION to the version of the luna note image}
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      # Root certificate of step-ca to verify the Kafka certificate.
      - step-ca-data:/step:ro
      - /etc/localtime:/etc/localtime:ro
    secrets:
      # Read by Spring via configtree: the file name is the property name.
      - source: luna_db_password
        target: spring.datasource.password
      - source: kafka_luna_note_password
        target: app.kafka.password
    networks:
      - luna
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.luna-note.rule: Host(`luna.internal`) && PathPrefix(`/api/luna-note`)
        traefik.http.routers.luna-note.entrypoints: websecure
        traefik.http.routers.luna-note.tls.certresolver: stepca
        traefik.http.routers.luna-note.middlewares: luna-note-strip-prefix
        traefik.http.middlewares.luna-note-strip-prefix.stripprefix.prefixes: /api/luna-note
        traefik.http.services.luna-note.loadbalancer.server.port: "7084"

networks:
  luna:
    name: luna
    driver: overlay
    attachable: true

volumes:
  step-ca-data:

secrets:
  luna_db_password:
    external: true
  kafka_luna_note_password:
    external: true
